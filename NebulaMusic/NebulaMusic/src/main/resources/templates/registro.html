<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nebula Music - Registro</title>
    </head>
    <body>
        <main class="auth-container">
            <section class="auth-card">
                <form method="post" action="/crear-cuenta">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" minlength="3">
                    <br><br>
                    <label for="correo">Correo: </label>
                    <input type="email" id="correo" name="correo">
                    <br><br>
                    <label for="contrasenia">Contraseña: </label>
                    <input type="password" id="contrasenia" name="contrasenia">
                    <br><br>
                    <label for="txt_pseudonimo">Pseudonimo</label>
                    <input
                            type="text"
                            id="txt_pseudonimo"
                            pattern="[a-zA-Z]{3,10}-[0-9]{2,10}"
                    >
                    <br><br>
                    <label>Genero</label>
                    <br>
                    <input type="radio" id="masculino" name="rad_genero" value="M">
                    <label for="masculino">Masculino</label>
                    <input type="radio" id="femenino" name="rad_genero" value="F">
                    <label for="femenino">Femenino</label>
                    <input type="radio" id="otro" name="rad_genero" value="O">
                    <label for="otro">Otro</label>
                    <br><br>
                    <label for="sel_suscripcion">Suscripción:</label>
                    <select name="sel_suscripcion" id="sel_suscripcion">
                        <option value="gratis">Gratis</option>
                        <option value="mensual">Mensual</option>
                        <option value="anual">Anual</option>
                    </select>
                    <br><br>
                    <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                    <input type="date" name="fechaNacimiento" id="fechaNacimiento">
                    <br><br>
                    <br><br>
                    <label>
                        <input type="checkbox" name="chk_terminos">
                        Acepto los términos y condiciones.
                    </label>
                    <br><br>
                    <label for="comentarios">Comentarios:</label>
                    <textarea name="comentarios" id="comentarios" rows="5" cols="40"></textarea>
                    <br><br>
                    <button type="submit">Registrar</button>
                    <button type="reset">Restablecer</button>
                </form>
            </section>
        </main>
    </body>
</html>
